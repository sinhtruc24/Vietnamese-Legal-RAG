[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.1.0"
description = "Vietnamese legal question answering with hybrid RAG and a QLoRA-tuned LLM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Dense retrieval + reranker (needs PyTorch)
ml = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
# LLM client, API and demo UI
serve = [
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gradio>=4.0",
    "requests>=2.31",
    "huggingface_hub>=0.23",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
